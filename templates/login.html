<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE - Digital Mining Platform Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0284c7;
            --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --primary-hover: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            --accent-cyan: #38bdf8;
            --slate-blue: #2563eb;
            --bg-outer: #f1f5f9;
            --text-heading: #0f172a;
            --text-body: #475569;
            --text-muted: #94a3b8;
            --bezel-color: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-outer);
            background-image: 
                radial-gradient(#cbd5e1 1px, transparent 1px),
                linear-gradient(135deg, rgba(2, 132, 199, 0.03) 0%, rgba(30, 41, 59, 0.04) 100%);
            background-size: 24px 24px, 100% 100%;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            color: var(--text-heading);
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle angled decorative grid lines in the background */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 140px,
                rgba(203, 213, 225, 0.25) 140px,
                rgba(203, 213, 225, 0.25) 141px
            );
            pointer-events: none;
            z-index: 0;
        }

        /* Device-like Floating Frame Card Container (as in reference layout) */
        .auth-device-card {
            width: 100%;
            max-width: 980px;
            background: #ffffff;
            border-radius: 28px;
            border: 10px solid var(--bezel-color);
            box-shadow: 
                0 30px 70px -15px rgba(15, 23, 42, 0.28),
                0 0 0 1px rgba(15, 23, 42, 0.08);
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* ==========================================================================
           Left Side: Modern Clean White Login Form
           ========================================================================== */
        .auth-form-side {
            background: #ffffff;
            padding: 38px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* Centered Logo App Icon */
        .app-icon-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .app-logo-squircle {
            width: 48px;
            height: 48px;
            background: #0f172a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
            padding: 6px;
        }

        .app-logo-squircle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .auth-title {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }

        .auth-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 320px;
            line-height: 1.4;
        }

        /* Error Alert */
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 11.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* Role Selector Pills */
        .role-section {
            margin-bottom: 16px;
        }

        .section-mini-label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .role-chips-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .role-chip {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .role-chip input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .chip-box {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .chip-box i {
            font-size: 11px;
            color: #64748b;
        }

        .chip-box span {
            font-size: 11.5px;
            font-weight: 600;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .role-chip:hover .chip-box {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .role-chip input[type="radio"]:checked + .chip-box {
            background: #f0f9ff;
            border-color: #0284c7;
            box-shadow: 0 0 0 1px #0284c7;
        }

        .role-chip input[type="radio"]:checked + .chip-box span {
            color: #0369a1;
            font-weight: 700;
        }

        .role-chip input[type="radio"]:checked + .chip-box i {
            color: #0284c7;
        }

        /* Credentials Fields */
        .credentials-box {
            margin-bottom: 14px;
        }

        .cred-quick-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .btn-quick-fill {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #0284c7;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .btn-quick-fill:hover {
            background: #0284c7;
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-field-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrap i.field-icon {
            position: absolute;
            left: 12px;
            color: #94a3b8;
            font-size: 13px;
            pointer-events: none;
        }

        .modern-input {
            width: 100%;
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            color: #0f172a;
            padding: 9px 12px 9px 34px;
            border-radius: 10px;
            font-size: 12.5px;
            outline: none;
            transition: all 0.15s ease;
        }

        .modern-input::placeholder {
            color: #94a3b8;
            font-size: 12px;
        }

        .modern-input:focus {
            border-color: #0284c7;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
        }

        .pwd-toggle-btn:hover {
            color: #475569;
        }

        /* reCAPTCHA Mini Box */
        .recaptcha-mini {
            background: #fafafa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            cursor: pointer;
            user-select: none;
        }

        .recaptcha-mini:hover {
            background: #f4f4f5;
        }

        .recaptcha-check-circle {
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .recaptcha-check-circle.checked {
            border-color: #059669;
            background: #059669;
            color: #ffffff;
        }

        .recaptcha-label-text {
            font-size: 11.5px;
            color: #334155;
            font-weight: 500;
            margin-left: 8px;
        }

        /* Primary Greyish-Blue Accent Login Button (Replacing the orange in reference) */
        .btn-continue-blue {
            width: 100%;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-continue-blue:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.45);
            transform: translateY(-1px);
        }

        .auth-footer-terms {
            text-align: center;
            font-size: 10.5px;
            color: #94a3b8;
            margin-top: 14px;
            line-height: 1.4;
        }

        .auth-footer-terms a {
            color: #0284c7;
            text-decoration: none;
        }

        /* ==========================================================================
           Right Side: Greyish-Blue 3D Ribbon / Fluid Wave Artwork
           ========================================================================== */
        .auth-artwork-side {
            background: #f8fafc;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-left: 1px solid #f1f5f9;
        }

        .artwork-svg-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artwork-svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .artwork-version-tag {
            position: absolute;
            bottom: 16px;
            right: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            font-family: monospace;
            z-index: 5;
            letter-spacing: 0.04em;
        }

        .artwork-brand-overlay {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #e2e8f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
            color: #0284c7;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* Responsive Breakpoints */
        @media (max-width: 820px) {
            body {
                padding: 16px;
            }

            .auth-device-card {
                grid-template-columns: 1fr;
                border-width: 6px;
                border-radius: 20px;
                max-width: 440px;
            }

            .auth-artwork-side {
                display: none;
            }

            .auth-form-side {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>

    <!-- Device-like Floating Frame Card Container -->
    <div class="auth-device-card">
        
        <!-- Left Side: Clean Login Form -->
        <div class="auth-form-side">
            <!-- App Icon & Title -->
            <div class="app-icon-header">
                <div class="app-logo-squircle">
                    <img src="/static/media_screenshots/trace_main_logo.jpeg" alt="TRACE Logo">
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Unified AI-Powered Mining Digital Platform</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="/login" method="POST" id="loginForm">
                <!-- STEP 1: SELECT ROLE -->
                <div class="role-section">
                    <div class="section-mini-label">
                        <span>Select Role</span>
                        <span style="color: #0284c7; font-weight: 600; text-transform: none;">* Required</span>
                    </div>

                    <div class="role-chips-grid">
                        <!-- Role 1: General Manager -->
                        <label class="role-chip" onclick="handleRoleChange('gm', 'General Manager', 'gm@trace.gov.in', 'gm@trace2026')">
                            <input type="radio" name="role" value="gm" id="role_gm" checked>
                            <div class="chip-box">
                                <i class="fa-solid fa-user-tie"></i>
                                <span>General Manager</span>
                            </div>
                        </label>

                        <!-- Role 2: Vigilance Officer -->
                        <label class="role-chip" onclick="handleRoleChange('vigilance', 'Vigilance Officer', 'vigilance@trace.gov.in', 'vigilance@trace2026')">
                            <input type="radio" name="role" value="vigilance" id="role_vigilance">
                            <div class="chip-box">
                                <i class="fa-solid fa-shield-halved"></i>
                                <span>Vigilance Officer</span>
                            </div>
                        </label>

                        <!-- Role 3: Surveillance Officer -->
                        <label class="role-chip" onclick="handleRoleChange('surveillance', 'Surveillance Officer', 'surveillance@trace.gov.in', 'surveillance@trace2026')">
                            <input type="radio" name="role" value="surveillance" id="role_surveillance">
                            <div class="chip-box">
                                <i class="fa-solid fa-video"></i>
                                <span>Surveillance Officer</span>
                            </div>
                        </label>

                        <!-- Role 4: Dispatch Officer -->
                        <label class="role-chip" onclick="handleRoleChange('dispatch', 'Dispatch Officer (DO)', 'dispatch@trace.gov.in', 'dispatch@trace2026')">
                            <input type="radio" name="role" value="dispatch" id="role_dispatch">
                            <div class="chip-box">
                                <i class="fa-solid fa-truck-fast"></i>
                                <span>Dispatch Officer</span>
                            </div>
                        </label>

                        <!-- Role 5: Control Operator -->
                        <label class="role-chip" onclick="handleRoleChange('operator', 'Control Operator', 'operator@trace.gov.in', 'operator@trace2026')">
                            <input type="radio" name="role" value="operator" id="role_operator">
                            <div class="chip-box">
                                <i class="fa-solid fa-sliders"></i>
                                <span>Control Operator</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- STEP 2: CREDENTIALS INPUT -->
                <div class="credentials-box">
                    <div class="cred-quick-row">
                        <span style="color: #64748b; font-weight: 600;">Selected: <strong id="selectedRoleLabel" style="color: #0284c7;">General Manager</strong></span>
                        <button type="button" class="btn-quick-fill" onclick="autoFillCurrentCredentials()">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-fill Demo
                        </button>
                    </div>

                    <!-- Email Input -->
                    <div class="input-group">
                        <div class="input-field-wrap">
                            <i class="fa-regular fa-envelope field-icon"></i>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="modern-input" 
                                placeholder="Enter your email or username" 
                                required 
                                autocomplete="username"
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <div class="input-field-wrap">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="modern-input" 
                                placeholder="Enter your password" 
                                required 
                                autocomplete="current-password"
                            >
                            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                                <i class="fa-regular fa-eye" id="pwdEyeIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- reCAPTCHA Checkbox -->
                <div class="recaptcha-mini" onclick="toggleCaptcha()">
                    <div style="display: flex; align-items: center;">
                        <div class="recaptcha-check-circle" id="captchaBox">
                            <i class="fa-solid fa-check" id="captchaCheck" style="display: none; font-size: 11px;"></i>
                        </div>
                        <span class="recaptcha-label-text">I'm not a robot</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 4px; color: #94a3b8; font-size: 11px;">
                        <i class="fa-solid fa-shield" style="color: #0284c7;"></i>
                        <span style="font-size: 9.5px; font-weight: 600;">reCAPTCHA</span>
                    </div>
                </div>

                <!-- Greyish-Blue Accent Submit Button -->
                <button type="submit" class="btn-continue-blue" id="btnLogin">
                    <span id="btnLoginText">Continue to Dashboard</span>
                    <i class="fa-solid fa-arrow-right" style="font-size: 12px;"></i>
                </button>
            </form>

            <div class="auth-footer-terms">
                By signing in you agree to TRACE Digital Mining security and compliance protocols.
            </div>
        </div>

        <!-- Right Side: Greyish-Blue 3D Ribbon Artwork -->
        <div class="auth-artwork-side">
            <div class="artwork-brand-overlay">
                <i class="fa-solid fa-shield-halved"></i> Ministry of Coal & Mines
            </div>

            <!-- 3D Ribbon Vector Graphic in Greyish-Blue / Cyan Tones -->
            <div class="artwork-svg-container">
                <svg class="artwork-svg" viewBox="0 0 500 600" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Greyish-Blue / Cyan 3D Ribbon Gradients -->
                        <linearGradient id="blueRibbonGrad1" x1="10%" y1="0%" x2="90%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="35%" stop-color="#0284c7" />
                            <stop offset="70%" stop-color="#0369a1" />
                            <stop offset="100%" stop-color="#1e3a8a" />
                        </linearGradient>

                        <linearGradient id="blueRibbonGrad2" x1="0%" y1="20%" x2="100%" y2="80%">
                            <stop offset="0%" stop-color="#7dd3fc" />
                            <stop offset="50%" stop-color="#0284c7" />
                            <stop offset="100%" stop-color="#0f172a" />
                        </linearGradient>

                        <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="10" dy="20" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
                        </filter>

                        <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="30" result="blur" />
                        </filter>
                    </defs>

                    <!-- Background Soft Ambient Glow -->
                    <circle cx="280" cy="260" r="140" fill="#38bdf8" fill-opacity="0.12" filter="url(#glowEffect)" />
                    <circle cx="180" cy="420" r="120" fill="#0284c7" fill-opacity="0.08" filter="url(#glowEffect)" />

                    <!-- Background Secondary Ribbon Tube -->
                    <path d="M 120 -50 C 180 80, 480 160, 460 380 C 440 540, 200 620, 140 680" 
                          stroke="url(#blueRibbonGrad2)" 
                          stroke-width="56" 
                          stroke-linecap="round" 
                          fill="none" 
                          opacity="0.65"
                          filter="url(#ribbonShadow)" />

                    <!-- Primary 3D Front Ribbon Loop (Matching reference geometry in blue) -->
                    <path d="M 280 -60 C 350 80, 410 220, 370 340 C 320 480, 160 460, 140 650" 
                          stroke="url(#blueRibbonGrad1)" 
                          stroke-width="72" 
                          stroke-linecap="round" 
                          fill="none" 
                          filter="url(#ribbonShadow)" />

                    <!-- Inner Highlight Streak for 3D Tubular Sheen -->
                    <path d="M 282 -40 C 348 90, 400 220, 364 335 C 318 465, 170 450, 148 630" 
                          stroke="#ffffff" 
                          stroke-width="10" 
                          stroke-linecap="round" 
                          fill="none" 
                          opacity="0.35" />
                </svg>
            </div>

            <!-- Version Tag -->
            <div class="artwork-version-tag">TRACE AI v2.4.0</div>
        </div>

    </div>

    <script>
        // State management for role selection
        let currentRoleData = {
            role: 'gm',
            name: 'General Manager',
            email: 'gm@trace.gov.in',
            password: 'gm@trace2026'
        };

        function handleRoleChange(roleKey, roleName, defaultEmail, defaultPass) {
            currentRoleData = {
                role: roleKey,
                name: roleName,
                email: defaultEmail,
                password: defaultPass
            };

            // Update UI elements
            document.getElementById('selectedRoleLabel').textContent = roleName;
            document.getElementById('btnLoginText').textContent = 'Continue as ' + roleName;
            
            const usernameInput = document.getElementById('username');
            usernameInput.placeholder = `e.g. ${defaultEmail} or ${roleKey}`;
        }

        function autoFillCurrentCredentials() {
            document.getElementById('username').value = currentRoleData.email;
            document.getElementById('password').value = currentRoleData.password;
            
            const uInput = document.getElementById('username');
            const pInput = document.getElementById('password');
            uInput.style.borderColor = '#0284c7';
            pInput.style.borderColor = '#0284c7';
            setTimeout(() => {
                uInput.style.borderColor = '';
                pInput.style.borderColor = '';
            }, 400);
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('pwdEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        let captchaChecked = false;
        function toggleCaptcha() {
            captchaChecked = !captchaChecked;
            const box = document.getElementById('captchaBox');
            const check = document.getElementById('captchaCheck');
            if (captchaChecked) {
                box.classList.add('checked');
                check.style.display = 'block';
            } else {
                box.classList.remove('checked');
                check.style.display = 'none';
            }
        }

        // Auto-check captcha for smooth demo flow
        window.addEventListener('DOMContentLoaded', () => {
            toggleCaptcha();
        });
    </script>
</body>
</html>
