<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACE - Digital Mining Platform Login</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0284c7;
            --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --primary-hover: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            --accent-cyan: #38bdf8;
            --bg-outer: #0b0f17;
            --card-dark: #131823;
            --bezel-color: #1a2230;
            --text-heading: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        /* Dark canvas with subtle dot pattern and ambient lighting */
        body {
            background-color: var(--bg-outer);
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.12) 1.2px, transparent 1.2px),
                linear-gradient(135deg, rgba(2, 132, 199, 0.06) 0%, rgba(15, 23, 42, 0.15) 100%);
            background-size: 24px 24px, 100% 100%;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            color: var(--text-heading);
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle angled decorative grid lines in the background */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 140px,
                rgba(255, 255, 255, 0.02) 140px,
                rgba(255, 255, 255, 0.02) 141px
            );
            pointer-events: none;
            z-index: 0;
        }

        /* Clean Enterprise Security Terminal Container */
        .auth-device-card {
            width: 100%;
            max-width: 1020px;
            background: var(--card-dark);
            border-radius: 12px;
            border: 1px solid #1e293b;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* ==========================================================================
           Left Side: Dark Theme Login Form
           ========================================================================== */
        .auth-form-side {
            background: var(--card-dark);
            padding: 40px 42px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* Header Title - Centered & Professional */
        .auth-header-group {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-title {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 400;
            line-height: 1.4;
        }

        /* Error Alert */
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            padding: 9px 12px;
            border-radius: 5px;
            font-size: 12px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* Role Selector - Crisp Engineering Chips */
        .role-section {
            margin-bottom: 16px;
        }

        .section-mini-label {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .role-chips-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .role-chip {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .role-chip:last-child {
            grid-column: span 2;
        }

        .role-chip input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .chip-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 10px;
            background: #0f141f;
            border: 1px solid #1e293b;
            border-radius: 5px;
            transition: all 0.15s ease;
        }

        .chip-box i {
            font-size: 11px;
            color: #64748b;
            transition: color 0.15s;
        }

        .chip-box span {
            font-size: 11.5px;
            font-weight: 500;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.15s;
        }

        .role-chip:hover .chip-box {
            background: #141b29;
            border-color: #334155;
        }

        .role-chip:hover .chip-box span {
            color: #e2e8f0;
        }

        .role-chip input[type="radio"]:checked + .chip-box {
            background: rgba(2, 132, 199, 0.1);
            border-color: #0284c7;
            box-shadow: none;
        }

        .role-chip input[type="radio"]:checked + .chip-box span {
            color: #38bdf8;
            font-weight: 600;
        }

        .role-chip input[type="radio"]:checked + .chip-box i {
            color: #38bdf8;
        }

        /* Credentials Fields */
        .credentials-box {
            margin-bottom: 14px;
        }

        .cred-quick-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .btn-quick-fill {
            background: #131b2a;
            border: 1px solid #293548;
            color: #94a3b8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .btn-quick-fill:hover {
            background: #1c2638;
            border-color: #0284c7;
            color: #38bdf8;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-field-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrap i.field-icon {
            position: absolute;
            left: 12px;
            color: #64748b;
            font-size: 13px;
            pointer-events: none;
        }

        .modern-input {
            width: 100%;
            background: #090d16;
            border: 1px solid #243042;
            color: #ffffff;
            padding: 9px 12px 9px 34px;
            border-radius: 5px;
            font-size: 12px;
            outline: none;
            transition: all 0.15s ease;
        }

        .modern-input::placeholder {
            color: #64748b;
            font-size: 11.5px;
        }

        .modern-input:focus {
            border-color: #0284c7;
            background: #0d131f;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
        }

        .pwd-toggle-btn:hover {
            color: #cbd5e1;
        }

        /* reCAPTCHA Mini Box */
        .recaptcha-mini {
            background: #090d16;
            border: 1px solid #243042;
            border-radius: 5px;
            padding: 7px 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.15s;
        }

        .recaptcha-mini:hover {
            border-color: #334155;
        }

        .recaptcha-check-circle {
            width: 16px;
            height: 16px;
            border: 1.5px solid #475569;
            border-radius: 3px;
            background: #141b29;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .recaptcha-check-circle.checked {
            border-color: #059669;
            background: #059669;
            color: #ffffff;
        }

        .recaptcha-label-text {
            font-size: 11.5px;
            color: #cbd5e1;
            font-weight: 500;
            margin-left: 8px;
        }

        /* Primary Enterprise Login Button */
        .btn-continue-blue {
            width: 100%;
            background: #0284c7;
            color: #ffffff;
            border: 1px solid #0369a1;
            border-radius: 5px;
            padding: 10px 16px;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-continue-blue:hover {
            background: #0369a1;
            border-color: #075985;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
            transform: none;
        }

        .auth-footer-terms {
            text-align: center;
            font-size: 10.5px;
            color: #64748b;
            margin-top: 14px;
            line-height: 1.4;
        }

        /* ==========================================================================
           Right Side: Dark Canvas with Logo to the Left of Free-Flowing Blue Lines
           ========================================================================== */
        .auth-artwork-side {
            background: linear-gradient(135deg, #101520 0%, #0d121b 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
        }

        .artwork-svg-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .artwork-svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Hero Logo on Artwork Side (Integrated with TRACE and slogan) */
        .artwork-logo-wrap {
            position: absolute;
            top: 50%;
            left: 44%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .artwork-logo-wrap:hover {
            transform: translate(-50%, calc(-50% - 4px));
            filter: drop-shadow(0 12px 28px rgba(56, 189, 248, 0.35));
        }

        .artwork-hero-img {
            width: 155px;
            height: auto;
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), 0 0 22px rgba(2, 132, 199, 0.25);
            display: block;
        }

        .artwork-version-tag {
            position: absolute;
            bottom: 16px;
            right: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            font-family: monospace;
            z-index: 5;
            letter-spacing: 0.04em;
        }

        /* Responsive Breakpoints */
        @media (max-width: 860px) {
            body {
                padding: 16px;
            }

            .auth-device-card {
                grid-template-columns: 1fr;
                border-width: 6px;
                border-radius: 20px;
                max-width: 460px;
            }

            .auth-artwork-side {
                display: none;
            }

            .auth-form-side {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Dark Device-like Floating Frame Card Container -->
    <div class="auth-device-card">
        
        <!-- Left Side: Clean Login Form -->
        <div class="auth-form-side">
            <!-- Header Title -->
            <div class="auth-header-group">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Unified AI-Powered Mining Digital Platform</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="/login" method="POST" id="loginForm">
                <!-- STEP 1: SELECT ROLE -->
                <div class="role-section">
                    <div class="section-mini-label">
                        <span>Select Role</span>
                    </div>

                    <div class="role-chips-grid">
                        <!-- Role 1: General Manager -->
                        <label class="role-chip" onclick="handleRoleChange('gm', 'General Manager', 'gm@trace.gov.in', 'gm@trace2026')">
                            <input type="radio" name="role" value="gm" id="role_gm" checked>
                            <div class="chip-box">
                                <i class="fa-solid fa-user-tie"></i>
                                <span>General Manager</span>
                            </div>
                        </label>

                        <!-- Role 2: Vigilance Officer -->
                        <label class="role-chip" onclick="handleRoleChange('vigilance', 'Vigilance Officer', 'vigilance@trace.gov.in', 'vigilance@trace2026')">
                            <input type="radio" name="role" value="vigilance" id="role_vigilance">
                            <div class="chip-box">
                                <i class="fa-solid fa-shield-halved"></i>
                                <span>Vigilance Officer</span>
                            </div>
                        </label>

                        <!-- Role 3: Surveillance Officer -->
                        <label class="role-chip" onclick="handleRoleChange('surveillance', 'Surveillance Officer', 'surveillance@trace.gov.in', 'surveillance@trace2026')">
                            <input type="radio" name="role" value="surveillance" id="role_surveillance">
                            <div class="chip-box">
                                <i class="fa-solid fa-video"></i>
                                <span>Surveillance Officer</span>
                            </div>
                        </label>

                        <!-- Role 4: Dispatch Officer -->
                        <label class="role-chip" onclick="handleRoleChange('dispatch', 'Dispatch Officer (DO)', 'dispatch@trace.gov.in', 'dispatch@trace2026')">
                            <input type="radio" name="role" value="dispatch" id="role_dispatch">
                            <div class="chip-box">
                                <i class="fa-solid fa-truck-fast"></i>
                                <span>Dispatch Officer</span>
                            </div>
                        </label>

                        <!-- Role 5: Control Operator -->
                        <label class="role-chip" onclick="handleRoleChange('operator', 'Control Operator', 'operator@trace.gov.in', 'operator@trace2026')">
                            <input type="radio" name="role" value="operator" id="role_operator">
                            <div class="chip-box">
                                <i class="fa-solid fa-sliders"></i>
                                <span>Control Operator</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- STEP 2: CREDENTIALS INPUT -->
                <div class="credentials-box">
                    <div class="cred-quick-row">
                        <span style="color: #94a3b8; font-weight: 600;">Selected: <strong id="selectedRoleLabel" style="color: #38bdf8;">General Manager</strong></span>
                        <button type="button" class="btn-quick-fill" onclick="autoFillCurrentCredentials()">
                            <i class="fa-solid fa-bolt"></i> Auto-fill Demo
                        </button>
                    </div>

                    <!-- Email Input -->
                    <div class="input-group">
                        <div class="input-field-wrap">
                            <i class="fa-regular fa-envelope field-icon"></i>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="modern-input" 
                                placeholder="Enter your email or username" 
                                required 
                                autocomplete="username"
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <div class="input-field-wrap">
                            <i class="fa-solid fa-lock field-icon"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="modern-input" 
                                placeholder="Enter your password" 
                                required 
                                autocomplete="current-password"
                            >
                            <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password">
                                <i class="fa-regular fa-eye" id="pwdEyeIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- reCAPTCHA Checkbox -->
                <div class="recaptcha-mini" onclick="toggleCaptcha()">
                    <div style="display: flex; align-items: center;">
                        <div class="recaptcha-check-circle" id="captchaBox">
                            <i class="fa-solid fa-check" id="captchaCheck" style="display: none; font-size: 11px;"></i>
                        </div>
                        <span class="recaptcha-label-text">I'm not a robot</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 4px; color: #64748b; font-size: 11px;">
                        <i class="fa-solid fa-shield" style="color: #38bdf8;"></i>
                        <span style="font-size: 9.5px; font-weight: 600;">reCAPTCHA</span>
                    </div>
                </div>

                <!-- Primary Accent Login Button -->
                <button type="submit" class="btn-continue-blue" id="btnLogin">
                    <span id="btnLoginText">Continue to Dashboard</span>
                    <i class="fa-solid fa-arrow-right" style="font-size: 12px;"></i>
                </button>
            </form>

            <div class="auth-footer-terms">
                By signing in you agree to TRACE Digital Mining security and compliance protocols.
            </div>
        </div>

        <!-- Right Side: Dark 3D Ribbon Artwork with Logo Positioned to the Left of the Lines -->
        <div class="auth-artwork-side">
            <!-- Integrated TRACE Hero Logo (includes emblem, TRACE name, and slogan) -->
            <div class="artwork-logo-wrap">
                <img src="/static/media_screenshots/trace_login_hero_logo.png" alt="TRACE Mining AI" class="artwork-hero-img">
            </div>

            <!-- 3D Ribbon Vector Graphic in Vibrant Cyan & Blue Gradients -->
            <div class="artwork-svg-container">
                <svg class="artwork-svg" viewBox="0 0 500 600" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Vibrant 3D Ribbon Gradients -->
                        <linearGradient id="darkBlueRibbon1" x1="10%" y1="0%" x2="90%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="35%" stop-color="#0284c7" />
                            <stop offset="70%" stop-color="#0369a1" />
                            <stop offset="100%" stop-color="#1e293b" />
                        </linearGradient>

                        <linearGradient id="darkBlueRibbon2" x1="0%" y1="20%" x2="100%" y2="80%">
                            <stop offset="0%" stop-color="#7dd3fc" />
                            <stop offset="50%" stop-color="#0284c7" />
                            <stop offset="100%" stop-color="#080c14" />
                        </linearGradient>

                        <filter id="ribbonDarkShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
                        </filter>

                        <filter id="darkGlow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur stdDeviation="35" result="blur" />
                        </filter>
                    </defs>

                    <!-- Background Ambient Glowing Light Orbs -->
                    <circle cx="340" cy="240" r="140" fill="#0284c7" fill-opacity="0.18" filter="url(#darkGlow)" />
                    <circle cx="220" cy="450" r="120" fill="#38bdf8" fill-opacity="0.12" filter="url(#darkGlow)" />

                    <!-- Background Secondary Ribbon Tube -->
                    <path d="M 180 -50 C 240 80, 520 160, 500 380 C 480 540, 260 620, 200 680" 
                          stroke="url(#darkBlueRibbon2)" 
                          stroke-width="50" 
                          stroke-linecap="round" 
                          fill="none" 
                          opacity="0.55" 
                          filter="url(#ribbonDarkShadow)" />

                    <!-- Primary 3D Front Ribbon Loop (Flowing gracefully to the right of the logo) -->
                    <path d="M 345 -60 C 415 80, 445 220, 415 340 C 365 480, 200 460, 175 650" 
                          stroke="url(#darkBlueRibbon1)" 
                          stroke-width="68" 
                          stroke-linecap="round" 
                          fill="none" 
                          filter="url(#ribbonDarkShadow)" />

                    <!-- Inner Tubular Light Streak for 3D Sheen -->
                    <path d="M 347 -40 C 413 90, 435 220, 409 335 C 363 465, 210 450, 183 630" 
                          stroke="#ffffff" 
                          stroke-width="7" 
                          stroke-linecap="round" 
                          fill="none" 
                          opacity="0.35" />
                </svg>
            </div>

            <!-- Version Tag -->
            <div class="artwork-version-tag">TRACE AI v2.4.0</div>
        </div>

    </div>

    <script>
        // State management for role selection
        let currentRoleData = {
            role: 'gm',
            name: 'General Manager',
            email: 'gm@trace.gov.in',
            password: 'gm@trace2026'
        };

        function handleRoleChange(roleKey, roleName, defaultEmail, defaultPass) {
            currentRoleData = {
                role: roleKey,
                name: roleName,
                email: defaultEmail,
                password: defaultPass
            };

            // Update UI elements
            document.getElementById('selectedRoleLabel').textContent = roleName;
            document.getElementById('btnLoginText').textContent = 'Continue as ' + roleName;
            
            const usernameInput = document.getElementById('username');
            usernameInput.placeholder = `e.g. ${defaultEmail} or ${roleKey}`;
        }

        function autoFillCurrentCredentials() {
            document.getElementById('username').value = currentRoleData.email;
            document.getElementById('password').value = currentRoleData.password;
            
            const uInput = document.getElementById('username');
            const pInput = document.getElementById('password');
            uInput.style.borderColor = '#38bdf8';
            pInput.style.borderColor = '#38bdf8';
            setTimeout(() => {
                uInput.style.borderColor = '';
                pInput.style.borderColor = '';
            }, 400);
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('pwdEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        let captchaChecked = false;
        function toggleCaptcha() {
            captchaChecked = !captchaChecked;
            const box = document.getElementById('captchaBox');
            const check = document.getElementById('captchaCheck');
            if (captchaChecked) {
                box.classList.add('checked');
                check.style.display = 'block';
            } else {
                box.classList.remove('checked');
                check.style.display = 'none';
            }
        }

        // Auto-check captcha for smooth demo flow
        window.addEventListener('DOMContentLoaded', () => {
            toggleCaptcha();
        });
    </script>
</body>
</html>
