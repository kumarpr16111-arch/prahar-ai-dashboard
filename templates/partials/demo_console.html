<div id="sihDemoConsole" style="position: fixed; bottom: 18px; right: 18px; z-index: 9999; background: #0f172a; border: 1px solid #334155; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); font-family: system-ui, sans-serif; overflow: hidden; width: 270px; transition: all 0.3s ease;">
    <div style="background: #1e293b; padding: 7px 11px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleDemoConsole()">
        <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #38bdf8;">
            <i class="fa-solid fa-bolt"></i>
            <span>SIH Live Demo Console</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
            <i class="fa-solid fa-chevron-up" id="demoConsoleChevron" style="font-size: 9px; color: #94a3b8;"></i>
        </div>
    </div>
    <div id="demoConsoleBody" style="padding: 10px; display: flex; flex-direction: column; gap: 6px; background: #0b0f19;">
        <div style="font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between;">
            <span>Live DB:</span>
            <strong style="color: #34d399;">Supabase (PostgreSQL)</strong>
        </div>
        <button type="button" id="btnConsoleToggleAuto" onclick="toggleAutoSimulateAlerts()" style="background: #334155; color: #fff; border: none; padding: 6px 9px; border-radius: 4px; font-size: 10.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 5px;">
            <span><i class="fa-solid fa-bolt"></i> Auto Anomaly Sim</span>
            <span id="autoSimCountdownBadge" style="background: rgba(0,0,0,0.35); padding: 2px 6px; border-radius: 3px; font-size: 9.5px; font-family: monospace;">OFF</span>
        </button>
        <button type="button" onclick="triggerSimulateAlert()" style="background: #dc2626; color: #fff; border: none; padding: 6px 9px; border-radius: 4px; font-size: 10.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;">
            <i class="fa-solid fa-triangle-exclamation"></i> Trigger Anomaly Now
        </button>
        <button type="button" onclick="triggerSimulateFleet()" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 5px 9px; border-radius: 4px; font-size: 10.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;">
            <i class="fa-solid fa-truck-fast"></i> Simulate Fleet Step
        </button>
        <button type="button" onclick="syncAllFromSupabase()" style="background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 9px; border-radius: 4px; font-size: 10.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;">
            <i class="fa-solid fa-rotate"></i> Sync Supabase
        </button>
    </div>
</div>
